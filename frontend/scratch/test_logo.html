<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body {
    background: #0f172a;
    color: white;
    font-family: 'Cairo', sans-serif;
    padding: 50px;
    display: flex;
    gap: 50px;
  }
  .logo-box {
    width: 140px;
    display: flex;
    flex-direction: column;
    border: 1px dashed rgba(255,255,255,0.2);
    padding: 10px;
  }
  .arabic {
    font-weight: 900;
    color: #ffffff;
    line-height: 1.1;
    display: flex;
    justify-content: space-between;
    width: 100%;
  }
  .english {
    font-weight: 800;
    color: #ffffff;
    display: flex;
    justify-content: space-between;
    width: 100%;
    text-transform: uppercase;
  }
  .slogan {
    font-weight: 600;
    color: #38bdf8; /* Cyan accent */
    display: flex;
    justify-content: space-between;
    width: 100%;
    font-size: 9.5px;
  }
</style>
</head>
<body>
  <div class="logo-box">
    <!-- Option 1: Flex justify-between on all 3 lines -->
    <div style="font-size: 26px; font-weight: 900; letter-spacing: 0px; text-align: center; color: white;">مَــــدَار</div>
    <div class="english" style="font-size: 11px;">
      <span>M</span><span>A</span><span>D</span><span>A</span><span>A</span><span>R</span>
    </div>
    <div class="slogan" style="margin-top: 2px;">
      منصاتك بنفس المدار
    </div>
  </div>
</body>
</html>
