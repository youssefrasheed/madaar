<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>User Uploaded Madaar Logos</title>
<style>
  body {
    margin: 0;
    padding: 40px;
    background: #0b0f19;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    gap: 40px;
    align-items: center;
  }
  .card {
    border-radius: 20px;
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 600px;
  }
  .card.dark {
    background: #0f172a;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .card.light {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    color: #0f172a;
  }
  img {
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>

  <h1>شعارات مَـدَار الرسمية من تصميم المستخدم</h1>

  <!-- Dark Mode (logo 01.svg) -->
  <div class="card dark">
    <h3>النسخة الداكنة (White Text on Dark BG) - logo 01.svg</h3>
    <img src="/logo-01.svg" alt="Madaar Dark Logo">
  </div>

  <!-- Light Mode (Logo.svg) -->
  <div class="card light">
    <h3>النسخة الفاتحة (Dark Text on Light BG) - Logo.svg</h3>
    <img src="/Logo.svg" alt="Madaar Light Logo">
  </div>

</body>
</html>
