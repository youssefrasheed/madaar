# Nginx Configuration Template for Madaar Subdomain
# Replace YOUR_SUBDOMAIN (e.g. app.madaar.com) and /path/to/social-media-hub with your real values.

server {
    listen 80;
    server_name YOUR_SUBDOMAIN;

    # Redirect all HTTP traffic to HTTPS (Certbot will manage this automatically once executed)
    # return 301 https://$host$request_uri;

    # Root directory pointing to the compiled Vite production frontend
    root /var/www/social-media-hub/frontend/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets Caching (Vite hashed files in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SVG & Favicon Caching
    location ~* \.(svg|png|jpg|jpeg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Node.js API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;

        # Upload size for post media
        client_max_body_size 50M;
    }

    # SPA Routing: Fallback all other routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
